name: Publish to gh-pages

# ✅ Pages 的發布來源是 gh-pages 分支，這個 workflow 負責把 main 同步過去
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force gh-pages to match main
        run: git push origin HEAD:gh-pages --force
